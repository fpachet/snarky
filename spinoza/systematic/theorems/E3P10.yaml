schema_version: 1
id: E3P10
model: ethics_iii_systematic_v1
source_unit: E3P10
source_text: >-
  Une idée qui exclut l'existence de notre Corps ne peut être donnée dans
  l'Âme, mais lui est contraire.
fact_files:
  - facts/postulates.yaml
rule_files:
  - rules/external.rules
  - rules/validated/E3P05.rules
  - rules/validated/E3P06.rules
  - rules/validated/E3P07.rules
  - rules/proofs/E3P10.rules
rule_catalog: rules/catalog.yaml
forbidden_rules:
  - E3P10_idee_excluant_corps_absente_et_contraire
allowed_rule_origins:
  - textual
  - textual_theorem
  - external_textual
cases:
  - id: idee_excluant_corps
    initial_facts:
      - "(menace0 peut_detruire corps0)"
      - "(idee_menace0 est_idee_de menace0)"
      - "(idee_menace0 exclut_existence_de corps0)"
      - "(dieu a_idee_de corps0)"
      - "(ame0 est_idee_de corps0)"
      - "(ame0 est_chose_singuliere VRAI)"
      - "(effort0 est_effort_de ame0)"
      - "(essence0 est_essence_actuelle_de ame0)"
    goals:
      - entity: "(idee_menace0 est_donnee_dans ame0)"
        status: FAUX
      - "(idee_menace0 est_contraire_a ame0)"
    expected:
      status: proved
      proof_depths: [3, 4]
  - id: idee_non_excluante
    initial_facts:
      - "(idee_neutre0 est_idee_de objet_neutre0)"
      - "(dieu a_idee_de corps0)"
      - "(ame0 est_idee_de corps0)"
      - "(ame0 est_chose_singuliere VRAI)"
      - "(effort0 est_effort_de ame0)"
      - "(essence0 est_essence_actuelle_de ame0)"
    goals: []
    must_not_derive:
      - entity: "(idee_neutre0 est_donnee_dans ame0)"
        status: FAUX
      - "(idee_neutre0 est_contraire_a ame0)"
    expected:
      status: proved
formalization_status: proved_with_external_textual_bridges
result: proved
limitations:
  - >-
    L'expression « donnée en Dieu en tant qu'il a l'idée du Corps » demeure un
    contexte relationnel explicite plutôt qu'une assertion globale sur Dieu.

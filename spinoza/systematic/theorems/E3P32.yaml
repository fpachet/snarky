schema_version: 1
id: E3P32
model: ethics_iii_systematic_v1
source_unit: E3P32
source_text: >-
  Si nous imaginons que quelqu'un tire de la joie d'une chose qu'un seul peut
  posséder, nous nous efforcerons de faire qu'il n'en ait plus la possession.
fact_files: [facts/postulates.yaml]
rule_files:
  - rules/validated/E3P27.rules
  - rules/proofs/E3P32.rules
rule_catalog: rules/catalog.yaml
forbidden_rules:
  - E3P32_joie_autrui_objet_exclusif_effort_retirer
  - E3P32S_envie_possesseur_exclusif
  - E3P32S_enfant_imite_action
allowed_rule_origins: [textual, textual_theorem]
cases:
  - id: possession_exclusive_et_envie
    initial_facts:
      - "(autrui0 a_corps corps_autrui0)"
      - "(ame0 est_idee_de corps_ame0)"
      - "(corps_autrui0 a_nature_corporelle_similaire_a corps_ame0)"
      - "(ame0 imagine autrui0)"
      - "(ame0 est_sans_affect_prealable_envers autrui0)"
      - "(ame0 imagine (autrui0 tire_joie_de objet_exclusif0))"
      - "(joie_source0 est_temoignage_affectif_de (autrui0 tire_joie_de objet_exclusif0))"
      - "(image_joie0 est_image_de (joie_source0 est_joie_de autrui0))"
      - "(joie_imitee0 accompagne image_joie0)"
      - "(joie_imitee0 est_temoignage_affectif_d_imitation_de joie_source0)"
      - "(objet_exclusif0 ne_peut_etre_possede_que_par_un VRAI)"
      - "(autrui0 possede objet_exclusif0)"
    goals:
      - "(autrui0 est_semblable_affectivement_pour ame0)"
      - "(ame0 imagine (joie_source0 est_joie_de autrui0))"
      - "(joie_imitee0 est_joie_de ame0)"
      - "(ame0 aime objet_exclusif0)"
      - "(ame0 desire_tirer_joie_de objet_exclusif0)"
      - "((autrui0 possession_de objet_exclusif0) est_obstacle_a (ame0 tire_joie_de objet_exclusif0))"
      - "(ame0 s_efforce_de_retirer (autrui0 possession_de objet_exclusif0))"
      - "(ame0 eprouve_envie_envers autrui0)"
    must_not_derive:
      - entity: "(autrui0 possede objet_exclusif0)"
        status: FAUX
      - "(objet_exclusif0 possede_par ame0)"
    expected:
      status: proved
      proof_depths: [1, 1, 2, 3, 3, 4, 5, 6]
  - id: objet_non_exclusif
    initial_facts:
      - "(autrui0 est_semblable_affectivement_pour ame0)"
      - "(ame0 est_sans_affect_prealable_envers autrui0)"
      - "(ame0 imagine (autrui0 tire_joie_de objet_partageable0))"
      - "(joie_source0 est_temoignage_affectif_de (autrui0 tire_joie_de objet_partageable0))"
      - "(image_joie0 est_image_de (joie_source0 est_joie_de autrui0))"
      - "(joie_imitee0 accompagne image_joie0)"
      - "(joie_imitee0 est_temoignage_affectif_d_imitation_de joie_source0)"
      - "(autrui0 possede objet_partageable0)"
    goals:
      - "(ame0 desire_tirer_joie_de objet_partageable0)"
    must_not_derive:
      - "(ame0 s_efforce_de_retirer (autrui0 possession_de objet_partageable0))"
      - "(ame0 eprouve_envie_envers autrui0)"
    expected:
      status: proved
      proof_depths: [3]
  - id: scolie_enfant_imitation
    initial_facts:
      - "(enfant0 est_enfant VRAI)"
      - "(autrui0 a_corps corps_autrui0)"
      - "(enfant0 est_idee_de corps_enfant0)"
      - "(corps_autrui0 a_nature_corporelle_similaire_a corps_enfant0)"
      - "(enfant0 imagine autrui0)"
      - "(enfant0 imagine (autrui0 a_fait action0))"
    goals:
      - "(autrui0 est_semblable_affectivement_pour enfant0)"
      - "(enfant0 desire_imiter action0)"
      - "(enfant0 s_efforce_d_imiter action0)"
    must_not_derive:
      - "(enfant0 a_fait action0)"
    expected:
      status: proved
      proof_depths: [1, 2, 2]
formalization_status: proved_with_scholium
result: proved
limitations:
  - >-
    L'exclusivité de la possession est un fait positif. Son absence ne signifie
    ni partageabilité ni non-exclusivité au sens logique.

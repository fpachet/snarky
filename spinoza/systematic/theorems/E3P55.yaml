schema_version: 1
id: E3P55
model: ethics_iii_systematic_v1
source_unit: E3P55
source_text: >-
  Quand l'Âme imagine son impuissance, elle est contristée par cela même.
fact_files: [facts/postulates.yaml]
rule_files:
  - rules/validated/E3P11.rules
  - rules/validated/E3P54.rules
  - rules/proofs/E3P55.rules
rule_catalog: rules/catalog.yaml
forbidden_rules:
  - E3P55_image_impuissance_tristesse
  - E3P55C_envie_vertu_exige_pair
allowed_rule_origins: [textual, textual_theorem]
cases:
  - id: imagination_impuissance
    initial_facts:
      - "(effort0 est_identique_ontologiquement_a essence0)"
      - "(essence0 est_essence_actuelle_de ame0)"
      - "(contenu_puissant0 pose_puissance_agir_de ame0)"
      - "(effort0 est_effort_de ame0)"
      - "(ame0 imagine (ame0 est_impuissante_a action0))"
      - "(image_impuissance0 est_image_de (ame0 est_impuissante_a action0))"
      - "(tristesse0 est_temoignage_affectif_de (image_impuissance0 reduit effort0))"
    goals:
      - "(effort0 est_effort_d_imaginer contenu_puissant0)"
      - "(image_impuissance0 reduit effort0)"
      - "(tristesse0 est_passion_de ame0)"
      - "(tristesse0 fait_passer_ame_vers perfection_moindre)"
      - "(tristesse0 est_tristesse_de ame0)"
    expected:
      status: proved
      proof_depths: [1, 2, 3, 3, 4]
  - id: blame_imagine
    initial_facts:
      - "(ame0 imagine (autrui0 blame ame0))"
      - "(tristesse_base0 est_tristesse_de ame0)"
      - "(tristesse_blame0 est_tristesse_de ame0)"
      - "(tristesse_blame0 nait_de_blame_imagine_de autrui0)"
    goals:
      - "(tristesse_blame0 est_plus_intense_que tristesse_base0)"
    expected:
      status: proved
      proof_depths: [1]
  - id: humilite_et_amour_propre
    initial_facts:
      - "(tristesse0 est_tristesse_de ame0)"
      - "(idee_faiblesse0 est_idee_de (ame0 a_faiblesse faiblesse0))"
      - "(idee_faiblesse0 accompagne tristesse0)"
      - "(joie0 est_joie_de ame0)"
      - "(joie0 a_pour_cause_interieure ame0)"
      - "(ame0 se_considere_avec_joie VRAI)"
    goals:
      - "(tristesse0 est_humilite_de ame0)"
      - "(joie0 est_amour_propre_de ame0)"
      - "(joie0 est_contentement_de_soi_de ame0)"
    expected:
      status: proved
      proof_depths: [1, 1, 1]
  - id: envie_envers_pair
    initial_facts:
      - "(autrui0 est_semblable_affectivement_pour ame0)"
      - "(ame0 imagine (autrui0 a_faiblesse faiblesse0))"
      - "(joie0 est_joie_de ame0)"
      - "(joie0 nait_de_faiblesse_imaginee_de autrui0)"
      - "(ame0 imagine (autrui0 a_vertu vertu0))"
      - "(tristesse0 est_tristesse_de ame0)"
      - "(tristesse0 nait_de_vertu_imaginee_de autrui0)"
    goals:
      - "(ame0 est_disposee_a_joie_du_mal_de autrui0)"
      - "(ame0 est_disposee_a_tristesse_du_bien_de autrui0)"
      - "(ame0 eprouve_envie_envers autrui0)"
    expected:
      status: proved
      proof_depths: [1, 1, 1]
  - id: vertu_sans_similitude
    initial_facts:
      - "(ame0 imagine (autrui0 a_vertu vertu0))"
      - "(tristesse0 est_tristesse_de ame0)"
      - "(tristesse0 nait_de_vertu_imaginee_de autrui0)"
    goals: []
    must_not_derive:
      - "(ame0 eprouve_envie_envers autrui0)"
    expected: {status: proved}
  - id: vertu_etrangere_veneree
    initial_facts:
      - "(vertu0 appartient_en_propre_a_nature_de autrui0)"
      - "(vertu0 est_etrangere_a_nature_de ame0)"
      - "(ame0 admire vertu0)"
      - "(veneration0 est_temoignage_veneration_de autrui0)"
    goals:
      - "(veneration0 est_veneration_de ame0)"
      - entity: "(ame0 eprouve_envie_envers autrui0)"
        status: FAUX
    expected:
      status: proved
      proof_depths: [1, 1]
  - id: strategies_pour_ecarter_comparaison
    initial_facts:
      - "(ame0 s_efforce_d_ecarter tristesse0)"
      - "(strategie_autrui0 est_strategie_d_ecartement_de tristesse0)"
      - "(strategie_autrui0 vise_actions_de autrui0)"
      - "(strategie_soi0 est_strategie_d_ecartement_de tristesse0)"
      - "(strategie_soi0 vise_actions_de ame0)"
    goals:
      - "(ame0 interprete_faussement_actions_de autrui0)"
      - "(ame0 orne_ses_actions VRAI)"
    expected:
      status: proved
      proof_depths: [1, 1]
formalization_status: proved_with_scholium_and_similarity_boundary
result: proved
limitations:
  - >-
    Les stratégies du scolie sont des branches explicitement choisies ; le
    moteur ne transforme pas leur alternative textuelle en deux obligations.

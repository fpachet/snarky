schema_version: 1
id: E3P29
model: ethics_iii_systematic_v1
source_unit: E3P29
source_text: >-
  Nous nous efforcerons de faire ce que nous imaginons que les hommes verront
  avec Joie, et nous aurons en aversion de faire ce qu'ils ont en aversion.
fact_files: [facts/postulates.yaml]
rule_files:
  - rules/validated/E3P27.rules
  - rules/validated/E3P28.rules
  - rules/proofs/E3P29.rules
rule_catalog: rules/catalog.yaml
forbidden_rules:
  - E3P29_joie_sociale_effort_faire
  - E3P29_aversion_sociale_aversion_faire
  - E3P29S_ambition_pour_plaire
  - E3P29S_humanite_pour_bien_commun
  - E3P29S_louange_action_agreable
  - E3P29S_blame_action_aversive
allowed_rule_origins: [textual, textual_theorem]
cases:
  - id: approbation_et_aversion_des_hommes
    initial_facts:
      - "(les_hommes0 est_groupe_d_hommes VRAI)"
      - "(les_hommes0 a_corps corps_groupe0)"
      - "(ame0 est_idee_de corps_ame0)"
      - "(corps_groupe0 a_nature_corporelle_similaire_a corps_ame0)"
      - "(ame0 imagine les_hommes0)"
      - "(ame0 imagine (les_hommes0 voit_avec_joie action_approuvee0))"
      - "(joie_sociale0 est_temoignage_affectif_social_de (les_hommes0 voit_avec_joie action_approuvee0))"
      - "(ame0 imagine (les_hommes0 a_en_aversion action_reprouvee0))"
      - "(tristesse_sociale0 est_temoignage_affectif_social_de (les_hommes0 a_en_aversion action_reprouvee0))"
    goals:
      - "(les_hommes0 est_semblable_affectivement_pour ame0)"
      - "(joie_sociale0 est_joie_de ame0)"
      - "(ame0 s_efforce_de_procurer_venue_de action_approuvee0)"
      - "(ame0 s_efforce_de_faire action_approuvee0)"
      - "(tristesse_sociale0 est_tristesse_de ame0)"
      - "(ame0 s_efforce_d_ecarter action_reprouvee0)"
      - "(ame0 a_en_aversion_de_faire action_reprouvee0)"
    must_not_derive:
      - "(action_approuvee0 est_faite VRAI)"
      - "(action_reprouvee0 est_detruite VRAI)"
    expected:
      status: proved
      proof_depths: [1, 2, 3, 4, 2, 3, 4]
  - id: scolie_ambition_et_humanite
    initial_facts:
      - "(ame0 s_efforce_de_faire action_ambitieuse0)"
      - "(effort_ambition0 est_effort_de_faire action_ambitieuse0)"
      - "(effort_ambition0 vise_seulement_a_plaire_aux les_hommes0)"
      - "(ame0 s_abstient_de_faire action_abstention0)"
      - "(effort_abstention0 est_effort_d_abstention_de action_abstention0)"
      - "(effort_abstention0 vise_seulement_a_plaire_aux les_hommes0)"
      - "(ame0 s_efforce_de_faire action_humaine0)"
      - "(effort_humanite0 est_effort_de_faire action_humaine0)"
      - "(effort_humanite0 vise_bien_commun VRAI)"
    goals:
      - "(effort_ambition0 est_ambition_de ame0)"
      - "(effort_abstention0 est_ambition_de ame0)"
      - "(effort_humanite0 est_humanite_de ame0)"
    expected:
      status: proved
      proof_depths: [1, 1, 1]
  - id: scolie_louange_et_blame
    initial_facts:
      - "(louange0 est_joie_de ame0)"
      - "(ame0 imagine (autrui0 a_fait action_agreable0))"
      - "(action_agreable0 est_effort_d_autrui_pour_etre_agreable_a ame0)"
      - "(blame0 est_tristesse_de ame0)"
      - "(ame0 imagine (autrui0 a_fait action_aversive0))"
      - "(ame0 a_en_aversion_de_faire action_aversive0)"
    goals:
      - "(louange0 est_louange_de ame0)"
      - "(blame0 est_blame_de ame0)"
    expected:
      status: proved
      proof_depths: [1, 1]
  - id: groupe_non_semblable
    initial_facts:
      - "(groupe0 est_groupe_d_hommes VRAI)"
      - "(ame0 imagine (groupe0 voit_avec_joie action0))"
      - "(joie_sociale0 est_temoignage_affectif_social_de (groupe0 voit_avec_joie action0))"
    goals: []
    must_not_derive:
      - "(joie_sociale0 est_joie_de ame0)"
      - "(ame0 s_efforce_de_faire action0)"
    expected: {status: proved}
formalization_status: proved_with_scholium
result: proved
limitations:
  - >-
    Le groupe « les hommes » est un individu collectif explicitement déclaré ;
    aucune quantification universelle sur tous les hommes n'est implicite.

schema_version: 1
id: E3P27
model: ethics_iii_systematic_v1
source_unit: E3P27
source_text: >-
  Si nous imaginons qu'une chose semblable à nous et à l'égard de laquelle
  nous n'éprouvons aucun affect éprouve quelque affection, nous éprouvons par
  cela même une affection semblable.
fact_files: [facts/postulates.yaml]
rule_files:
  - rules/validated/E3P13.rules
  - rules/validated/E3P22.rules
  - rules/validated/E3P23.rules
  - rules/proofs/E3P27.rules
rule_catalog: rules/catalog.yaml
forbidden_rules:
  - E3P27_similitude_corporelle_pertinente
  - E3P27_imitation_joie
  - E3P27_imitation_tristesse
  - E3P27_imitation_desir
  - E3P27S_commiseration_par_imitation_tristesse
  - E3P27S_emulation_par_imitation_desir
  - E3P27C2_commiseration_interdit_haine
  - E3P27C3_bienveillance_ne_de_commiseration
allowed_rule_origins: [textual, textual_theorem]
cases:
  - id: imitation_de_trois_affects
    initial_facts:
      - "(autrui0 a_corps corps_autrui0)"
      - "(ame0 est_idee_de corps_ame0)"
      - "(corps_autrui0 a_nature_corporelle_similaire_a corps_ame0)"
      - "(ame0 imagine autrui0)"
      - "(ame0 est_sans_affect_prealable_envers autrui0)"
      - "(ame0 imagine (joie_source0 est_joie_de autrui0))"
      - "(image_joie0 est_image_de (joie_source0 est_joie_de autrui0))"
      - "(joie_imitee0 accompagne image_joie0)"
      - "(joie_imitee0 est_temoignage_affectif_d_imitation_de joie_source0)"
      - "(ame0 imagine (tristesse_source0 est_tristesse_de autrui0))"
      - "(tristesse_source0 est_tristesse_imaginee_de autrui0)"
      - "(image_tristesse0 est_image_de (tristesse_source0 est_tristesse_de autrui0))"
      - "(tristesse_imitee0 accompagne image_tristesse0)"
      - "(tristesse_imitee0 est_temoignage_affectif_d_imitation_de tristesse_source0)"
      - "(ame0 imagine (desir_source0 est_desir_de autrui0))"
      - "(desir_source0 est_desir_imagine_de autrui0)"
      - "(image_desir0 est_image_de (desir_source0 est_desir_de autrui0))"
      - "(desir_imite0 accompagne image_desir0)"
      - "(desir_imite0 est_temoignage_affectif_d_imitation_de desir_source0)"
    goals:
      - "(autrui0 est_semblable_affectivement_pour ame0)"
      - "(joie_imitee0 est_joie_de ame0)"
      - "(tristesse_imitee0 est_tristesse_de ame0)"
      - "(desir_imite0 est_desir_de ame0)"
      - "(joie_imitee0 correspond_a_affect_imagine joie_source0)"
      - "(tristesse_imitee0 est_commiseration_de ame0)"
      - "(desir_imite0 est_emulation_de ame0)"
    expected:
      status: proved
      proof_depths: [1, 2, 2, 2, 2, 3, 3]
  - id: chose_deja_haie_affect_contraire
    initial_facts:
      - "(autrui0 a_corps corps_autrui0)"
      - "(ame0 est_idee_de corps_ame0)"
      - "(corps_autrui0 a_nature_corporelle_similaire_a corps_ame0)"
      - "(ame0 imagine autrui0)"
      - "(ame0 hait autrui0)"
      - "(ame0 imagine (tristesse_source0 est_tristesse_de autrui0))"
      - "(image_tristesse0 est_image_de (tristesse_source0 est_tristesse_de autrui0))"
      - "(joie_contraire0 accompagne image_tristesse0)"
      - "(joie_contraire0 est_passion_de ame0)"
    goals:
      - "(autrui0 est_semblable_affectivement_pour ame0)"
      - "(joie_contraire0 est_joie_de ame0)"
      - "(joie_contraire0 correspond_a_affect_contraire_imagine tristesse_source0)"
    must_not_derive:
      - "(joie_contraire0 est_tristesse_de ame0)"
      - "(joie_contraire0 est_imitation_de tristesse_source0)"
    expected:
      status: proved
      proof_depths: [1, 1, 1]
  - id: corollaire_amour_et_haine_des_causes
    initial_facts:
      - "(victime0 a_corps corps_victime0)"
      - "(ame0 est_idee_de corps_ame0)"
      - "(corps_victime0 a_nature_corporelle_similaire_a corps_ame0)"
      - "(ame0 imagine victime0)"
      - "(ame0 est_sans_affect_prealable_envers victime0)"
      - "(ame0 est_sans_affect_prealable_envers bienfaiteur0)"
      - "(ame0 imagine (bienfaiteur0 affecte_de_joie victime0))"
      - "(joie_source0 est_temoignage_affectif_de (bienfaiteur0 affecte_de_joie victime0))"
      - "(image_joie0 est_image_de (joie_source0 est_joie_de victime0))"
      - "(joie_imitee0 accompagne image_joie0)"
      - "(joie_imitee0 est_temoignage_affectif_d_imitation_de joie_source0)"
      - "(idee_bienfaiteur0 est_idee_de bienfaiteur0)"
      - "(ame0 est_sans_affect_prealable_envers malfaiteur0)"
      - "(ame0 imagine (malfaiteur0 affecte_de_tristesse victime0))"
      - "(tristesse_source0 est_temoignage_affectif_de (malfaiteur0 affecte_de_tristesse victime0))"
      - "(image_tristesse0 est_image_de (tristesse_source0 est_tristesse_de victime0))"
      - "(tristesse_imitee0 accompagne image_tristesse0)"
      - "(tristesse_imitee0 est_temoignage_affectif_d_imitation_de tristesse_source0)"
      - "(idee_malfaiteur0 est_idee_de malfaiteur0)"
    goals:
      - "(joie_imitee0 est_joie_de ame0)"
      - "(idee_bienfaiteur0 accompagne joie_imitee0)"
      - "(ame0 aime bienfaiteur0)"
      - "(tristesse_imitee0 est_tristesse_de ame0)"
      - "(idee_malfaiteur0 accompagne tristesse_imitee0)"
      - "(ame0 hait malfaiteur0)"
    expected:
      status: proved
      proof_depths: [2, 3, 4, 2, 3, 4]
  - id: corollaires_commiseration_et_bienveillance
    initial_facts:
      - "(autrui0 a_corps corps_autrui0)"
      - "(ame0 est_idee_de corps_ame0)"
      - "(corps_autrui0 a_nature_corporelle_similaire_a corps_ame0)"
      - "(ame0 imagine autrui0)"
      - "(ame0 est_sans_affect_prealable_envers autrui0)"
      - "(ame0 imagine (tristesse_source0 est_tristesse_de autrui0))"
      - "(tristesse_source0 est_tristesse_imaginee_de autrui0)"
      - "(image_tristesse0 est_image_de (tristesse_source0 est_tristesse_de autrui0))"
      - "(commiseration0 accompagne image_tristesse0)"
      - "(commiseration0 est_temoignage_affectif_d_imitation_de tristesse_source0)"
      - "(commiseration0 nait_du_dommage_de autrui0)"
      - "(misere0 est_misere_de autrui0)"
      - "(bienveillance0 est_temoignage_desir_ne_de commiseration0)"
    goals:
      - "(commiseration0 est_commiseration_de ame0)"
      - entity: "(ame0 hait autrui0)"
        status: FAUX
      - "(ame0 s_efforce_de_delivrer (autrui0 est_afflige_par misere0))"
      - "(bienveillance0 est_desir_de ame0)"
      - "(bienveillance0 est_bienveillance_de ame0)"
    expected:
      status: proved
      proof_depths: [3, 4, 4, 4, 4]
  - id: simple_trait_sans_similitude_corporelle
    initial_facts:
      - "(autrui0 a_trait trait0)"
      - "(ame0 imagine (autrui0 a_trait trait0))"
      - "(ame0 est_sans_affect_prealable_envers autrui0)"
      - "(ame0 imagine (joie_source0 est_joie_de autrui0))"
      - "(image_joie0 est_image_de (joie_source0 est_joie_de autrui0))"
      - "(joie_imitee0 accompagne image_joie0)"
      - "(joie_imitee0 est_temoignage_affectif_d_imitation_de joie_source0)"
    goals: []
    must_not_derive:
      - "(autrui0 est_semblable_affectivement_pour ame0)"
      - "(joie_imitee0 est_joie_de ame0)"
    expected: {status: proved}
formalization_status: proved_with_scholia_and_corollaries
result: proved
limitations:
  - >-
    La quantification « aucun affect » est représentée par le fait positif
    est_sans_affect_prealable_envers ; elle n'est pas inférée par fermeture du
    domaine des affects.

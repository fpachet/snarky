      - "(objet0 est_cause_efficiente_de tristesse0)"
      - "(joie0 est_affect_de ame0)"
      - "(tristesse0 est_affect_de ame0)"
      - "(joie0 est_contraire_a tristesse0)"
    goals:
      - "(ame0 est_en fluctuation_de_l_ame)"
      - "(objet0 cause_affects_multiples_et_contraires_de ame0)"

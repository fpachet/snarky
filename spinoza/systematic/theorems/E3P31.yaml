schema_version: 1
id: E3P31
model: ethics_iii_systematic_v1
source_unit: E3P31
source_text: >-
  Si nous imaginons quelqu'un aimer, désirer ou haïr ce que nous aimons,
  désirons ou haïssons, notre affect devient plus constant ; l'orientation
  contraire produit la fluctuation de l'âme.
fact_files: [facts/postulates.yaml]
rule_files:
  - rules/validated/E3P27.rules
  - rules/proofs/E3P31.rules
rule_catalog: rules/catalog.yaml
forbidden_rules:
  - E3P31_accord_amour_constance
  - E3P31_accord_desir_constance
  - E3P31_accord_haine_constance
  - E3P31_desaccord_fluctuation
  - E3P31C_amour_approbation_universelle
  - E3P31C_haine_desapprobation_universelle
allowed_rule_origins: [textual, textual_theorem]
cases:
  - id: accord_amour_desir_haine
    initial_facts:
      - "(autrui0 a_corps corps_autrui0)"
      - "(ame0 est_idee_de corps_ame0)"
      - "(corps_autrui0 a_nature_corporelle_similaire_a corps_ame0)"
      - "(ame0 imagine autrui0)"
      - "(ame0 aime objet_aime0)"
      - "(ame0 imagine (autrui0 aime objet_aime0))"
      - "(ame0 desire objet_desire0)"
      - "(ame0 imagine (autrui0 desire objet_desire0))"
      - "(ame0 hait objet_hai0)"
      - "(ame0 imagine (autrui0 hait objet_hai0))"
    goals:
      - "(autrui0 est_semblable_affectivement_pour ame0)"
      - "(ame0 aime_plus_constamment objet_aime0)"
      - "(ame0 desire_plus_constamment objet_desire0)"
      - "(ame0 hait_plus_constamment objet_hai0)"
    expected:
      status: proved
      proof_depths: [1, 2, 2, 2]
  - id: desaccord_et_fluctuation
    initial_facts:
      - "(autrui0 a_corps corps_autrui0)"
      - "(ame0 est_idee_de corps_ame0)"
      - "(corps_autrui0 a_nature_corporelle_similaire_a corps_ame0)"
      - "(ame0 imagine autrui0)"
      - "(ame0 aime objet0)"
      - "(ame0 imagine (autrui0 a_en_aversion objet0))"
    goals:
      - "(ame0 a_en_aversion_imitee objet0)"
      - "(ame0 aime_et_a_en_aversion objet0)"
      - "(ame0 est_en fluctuation_de_l_ame)"
    expected:
      status: proved
      proof_depths: [2, 2, 2]
  - id: corollaire_ambition_et_haine_mutuelle
    initial_facts:
      - "(premier0 aime objet_premier0)"
      - "(second0 hait objet_second0)"
      - "(effort_premier0 est_effort_d_approbation_de (aiment porte_sur objet_premier0))"
      - "(effort_second0 est_effort_d_approbation_de (haissent porte_sur objet_second0))"
      - "(premier0 fait_obstacle_a second0)"
      - "(second0 fait_obstacle_a premier0)"
    goals:
      - "(premier0 s_efforce_que (tous aiment objet_premier0))"
      - "(second0 s_efforce_que (tous haissent objet_second0))"
      - "(effort_premier0 est_ambition_de premier0)"
      - "(effort_second0 est_ambition_de second0)"
      - "(premier0 hait second0)"
      - "(second0 hait premier0)"
    expected:
      status: proved
      proof_depths: [1, 1, 2, 2, 3, 3]
  - id: accord_sans_similitude
    initial_facts:
      - "(ame0 aime objet0)"
      - "(ame0 imagine (autrui0 aime objet0))"
    goals: []
    must_not_derive:
      - "(ame0 aime_plus_constamment objet0)"
      - "(ame0 est_en fluctuation_de_l_ame)"
    expected: {status: proved}
formalization_status: proved_with_corollary_and_scholium
result: proved
limitations:
  - >-
    Le terme collectif tous rend l'effort universalisant explicite sans
    introduire de quantification universelle dans le moteur.

schema_version: 1
id: E3P08
model: ethics_iii_systematic_v1
source_unit: E3P08
source_text: >-
  L'effort par lequel chaque chose s'efforce de persévérer dans son être
  n'enveloppe aucun temps fini, mais un temps indéfini.
fact_files:
  - facts/postulates.yaml
rule_files:
  - rules/validated/E3P04.rules
  - rules/validated/E3P06.rules
  - rules/proofs/E3P08.rules
  - rules/compilation.rules
rule_catalog: rules/catalog.yaml
forbidden_rules:
  - E3P08_conatus_duree_indefinie
allowed_rule_origins:
  - textual
  - textual_theorem
  - compilation
cases:
  - id: refutation_du_temps_fini
    initial_facts:
      - "(chose0 est_chose_singuliere VRAI)"
      - "(effort0 est_effort_de chose0)"
      - "(hypothese_temps_fini suppose (effort0 enveloppe temps_fini))"
      - "(chose0 est_interne_a chose0)"
      - "(causes_exterieures0 represente_toutes_causes_exterieures_de chose0)"
      - entity: "(causes_exterieures0 detruit chose0)"
        status: FAUX
    goals:
      - entity: "(effort0 enveloppe temps_fini)"
        status: FAUX
      - "(effort0 enveloppe temps_indefini)"
    expected:
      status: proved
      proof_depths: [4, 2]
  - id: effort_sans_puissance_existence
    initial_facts:
      - "(effort0 est_effort_de chose0)"
      - "(hypothese_temps_fini suppose (effort0 enveloppe temps_fini))"
      - "(chose0 est_interne_a chose0)"
      - "(causes_exterieures0 represente_toutes_causes_exterieures_de chose0)"
      - entity: "(causes_exterieures0 detruit chose0)"
        status: FAUX
    goals: []
    must_not_derive:
      - entity: "(effort0 enveloppe temps_fini)"
        status: FAUX
      - "(effort0 enveloppe temps_indefini)"
    expected:
      status: proved
formalization_status: proved_with_explicit_reductio
result: proved
limitations:
  - >-
    La durée indéfinie est opposée au temps fini ; elle ne constitue pas une
    mesure numérique de durée.
  - >-
    causes_exterieures0 est un témoin collectif borné de l'absence de toute
    cause destructrice extérieure ; il ne réalise pas une quantification.

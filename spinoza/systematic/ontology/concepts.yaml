methodological_commitments:
  - L'absence d'un fait n'est jamais sa faussete.
  - Une impossibilite est representee par le statut explicite FAUX.
  - Les axiomes externes sont nommes par leur reference canonique.
  - Une proposition validee devient reutilisable seulement pour les suivantes.
  - Les regles historiques de Gondran ne sont pas chargees dans ce modele.
  - Un contre-cas verifie une non-derivation sans la convertir en fait FAUX.
  - Une hypothese est refutee seulement par une proposition explicitement FAUX.
  - Les relations en tant que conservent leur idee ou leur contexte comme objet.
  - Juger bon peut suivre du conatus mais ne produit jamais le conatus par inversion.
  - Imaginer une proposition ne rend jamais cette proposition vraie hors contexte.
  - Une image temporelle peut affirmer une existence dans l'imagination sans existence brute.
  - La conservation ou la destruction imaginee ne devient jamais un fait du monde.
  - L'intensite affective est d'abord un ordre qualitatif, sans coefficient numerique.
  - Les conclusions annexes de SpinoLog ne sont jamais importees sans justification textuelle.
  - Affirmer ou nier un contenu ne rend jamais ce contenu vrai ou faux hors contexte.
  - L'inversion de valence envers une chose haie reste explicite dans la correspondance des affects.
  - L'absence prealable d'affect est un fait positif et non une negation par defaut.
  - Une ressemblance de trait ne suffit pas a etablir la similitude corporelle de E3P27.
  - Un effort portant sur une proposition ne rend jamais cette proposition vraie hors contexte.
  - La jalousie conserve explicitement la chose aimee et le rival comme deux objets distincts.
  - Les circonstances rappelees forment une configuration nommee et ne sont pas generees implicitement.
  - L'abolition entiere d'un affect est un fait positif et non une absence silencieuse.
  - Une absence de crainte est explicite et ne resulte jamais de la negation par defaut.
  - Mediter une action ou s'efforcer de l'accomplir ne signifie pas qu'elle a eu lieu.

source_text: Nous nous efforçons d’affirmer de nous et de la chose aimée tout ce que nous imaginons qui
  l’affecte ou nous affecte de Joie ; et, au contraire, de nier tout ce que nous imaginons qui l’affecte
  ou nous affecte de Tristesse.

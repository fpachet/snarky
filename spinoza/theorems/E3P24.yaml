source_unit: E3P24
source_text: Si nous imaginons que quelqu’un affecte de Joie une chose que nous avons en haine, nous serons
  affectés de Haine à son égard. Si, au contraire, nous imaginons qu’il l’affecte de Tristesse, nous serons
  affectés d’Amour à son égard.

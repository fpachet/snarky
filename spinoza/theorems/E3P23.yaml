source_unit: E3P23
source_text: Qui imagine affecté de Tristesse ce qu’il a en haine, sera joyeux ; si, au contraire, il
  l’imagine affecté de Joie, il sera contristé ; et l’une et l’autre affections seront plus grandes ou
  moindres, selon que l’affection contraire sera plus grande ou moindre dans la chose haïe.

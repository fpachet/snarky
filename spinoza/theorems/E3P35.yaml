source_unit: E3P35
source_text: Si quelqu’un imagine qu’un autre s’attache la chose aimée par le même lien d’Amitié, ou un
  plus étroit, que celui par lequel il l’avait seul en sa possession, il sera affecté de Haine envers
  la chose aimée elle-même, et sera envieux de l’autre.

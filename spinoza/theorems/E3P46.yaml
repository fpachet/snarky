id: E3P46
type: theorem
source_unit: E3P46
source_text: Si quelqu’un a été affecté par un autre, appartenant à une classe ou à une nation différente,
  d’une Joie ou d’une Tristesse qu’accompagne comme cause l’idée de cet autre sous le nom général de la
  classe ou de la nation, non seulement il aimera cet autre ou l’aura en haine, mais aussi tous ceux de
  la même classe ou de la même nation.

source_text: Si nous avons déjà vu un objet en même temps que d’autres, ou si nous imaginons qu’il n’a
  rien qui ne soit commun à plusieurs, nous ne le considérerions pas aussi longtemps que celui que nous
  imaginons qui a quelque chose de singulier.

source_text: Si nous imaginons que quelqu’un aime, ou désire, ou a en haine ce que nous-même aimons, désirons,
  ou avons en haine, notre amour, etc., deviendra par cela même plus constant. Si, par contre, nous imaginons
  qu’il a en aversion ce que nous aimons, ou inversement, nous éprouverons la passion dite Fluctuation
  de l’Âme.

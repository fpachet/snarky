source_unit: E3P28
source_text: Tout ce que nous imaginons qui mène à la Joie, nous nous efforçons d’en procurer la venue
  ; tout ce que nous imaginons qui lui est contraire ou mène à la Tristesse, nous nous efforçons de l’écarter
  ou de le détruire.

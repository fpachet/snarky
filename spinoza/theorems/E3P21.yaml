source_unit: E3P21
source_text: Qui imagine ce qu’il aime affecté de Joie ou de Tristesse, sera également affecté de Joie
  ou de Tristesse ; et l’une et l’autre affections seront plus grandes ou moindres dans l’amant, selon
  qu’elles le seront dans la chose aimée.

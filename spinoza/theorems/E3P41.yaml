source_unit: E3P41
source_text: Si quelqu’un imagine qu’il est aimé par un autre et croit ne lui avoir donné aucune cause
  d’amour (ce qui, suivant le Corollaire de la Proposition 15 et la Proposition 16, peut arriver), il
  l’aimera à son tour.

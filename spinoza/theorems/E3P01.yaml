source_text: Notre Âme est active en certaines choses, passive en d’autres, savoir, en tant qu’elle a
  des idées adéquates, elle est nécessairement active en certaines choses ; en tant qu’elle a des idées
  inadéquates, elle est nécessairement passive en certaines choses.

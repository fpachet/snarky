source_unit: E3P39
source_text: Qui a quelqu’un en haine s’efforcera de lui faire du mal, à moins qu’il ne craigne qu’un
  mal plus grand ne naisse pour lui de là ; et, au contraire, qui aime quelqu’un s’efforcera par la même
  loi de lui faire du bien.

source_unit: E3P38
source_text: Si quelqu’un commence d’avoir en haine une chose aimée, de façon que l’Amour soit entièrement
  aboli, il aura pour elle, à motif égal, plus de haine que s’il ne l’avait jamais aimée, et d’autant
  plus que son Amour était auparavant plus grand.

source_unit: E3P48
source_text: L’Amour et la Haine, par exemple envers Pierre, sont détruits si la Tristesse qu’enveloppe
  la seconde et la Joie qu’enveloppe le premier, sont joints à l’idée d’une autre cause ; et Amour et
  Haine sont diminués dans la mesure où nous imaginons que Pierre n’est pas la cause à lui seul de la
  Tristesse ou de la Joie qu’enveloppent ces affections.

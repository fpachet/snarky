source_unit: E3P22
source_text: Si nous imaginons que quelqu’un affecte de Joie la chose que nous aimons, nous serons affectés
  d’Amour à son égard. Si, au contraire, nous imaginons qu’il l’affecte de Tristesse, nous serons tout
  au rebours affectés de Haine contre lui.

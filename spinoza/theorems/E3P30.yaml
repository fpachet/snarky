source_unit: E3P30
source_text: Si quelqu’un a fait quelque chose qu’il imagine qui affecte les autres de Joie, il sera affecté
  d’une Joie qu’accompagnera l’idée de lui-même comme cause, autrement dit il se considérera lui-même
  avec joie. Si, au contraire, il a fait quelque chose qu’il imagine qui affecte les autres de Tristesse,
  il se considérera lui-même avec Tristesse.

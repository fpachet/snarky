schema_version: 1
status: executable_p1_to_p7
scope: clips_grid3x3_p1_to_p7
required_engine_features:
  available:
    - rule_groups
    - persistent_inference_sessions
    - comparisons
    - provenance
    - remove_fact
    - mutation_events
    - mutation_aware_refraction
    - correlated_not_exists
    - correlated_count
    - correlated_unique
  missing: []

groups:
  - name: derive_solved_cells
    purpose: Materialize cells that currently have exactly one candidate.
    rules:
      - mark_single_candidate_cell

  - name: naked_singles
    clips_rank: 1
    first_required_by: grid3x3-p1
    rules:
      - eliminate_single_value_from_peers

  - name: hidden_singles
    clips_rank: 2
    first_required_by: grid3x3-p2
    rules:
      - keep_unique_value_in_unit

  - name: locked_candidates_single_line
    clips_rank: 3
    first_required_by: grid3x3-p3
    rules:
      - eliminate_box_locked_value_from_row
      - eliminate_box_locked_value_from_column

  - name: locked_candidates_multiple_lines
    clips_rank: 4
    first_required_by: grid3x3-p4
    rules:
      - eliminate_row_locked_value_from_box
      - eliminate_column_locked_value_from_box

  - name: naked_pairs
    clips_rank: 5
    first_required_by: grid3x3-p5
    rules:
      - eliminate_first_naked_pair_value_from_unit
      - eliminate_second_naked_pair_value_from_unit

  - name: hidden_pairs
    clips_rank: 6
    first_required_by: grid3x3-p6
    rules:
      - eliminate_other_values_from_first_hidden_pair_cell
      - eliminate_other_values_from_second_hidden_pair_cell

  - name: x_wing
    clips_rank: 7
    first_required_by: grid3x3-p7
    rules:
      - eliminate_x_wing_first_column_from_other_rows
      - eliminate_x_wing_second_column_from_other_rows
      - eliminate_x_wing_first_row_from_other_columns
      - eliminate_x_wing_second_row_from_other_columns

  - name: validate_state
    purpose: Detect solved, stuck, and inconsistent states.
    rules:
      - detect_cell_without_candidate
      - detect_duplicate_solved_value_in_unit
      - detect_solved_grid

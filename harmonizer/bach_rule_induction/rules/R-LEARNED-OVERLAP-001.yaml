schema_version: 1
id: R-LEARNED-OVERLAP-001
title: Évitement du chevauchement numérique de voix adjacentes
lifecycle: SUPPORTED
status: NORMALLY
statement: >
  Pour deux voix adjacentes, éviter que la nouvelle note de la voix supérieure
  descende sous la note précédente de la voix inférieure, ou que la nouvelle
  note de la voix inférieure monte au-dessus de la note précédente de la voix
  supérieure.
scope:
  voices: [soprano_alto, alto_tenor, tenor_bass]
  window: [previous_attack, current_attack]
  corpus: music21-3.1.0-deepbach-352
  split: variant-safe-251-50-51
conditions:
  - previous_lower - candidate_upper > 0 OR candidate_lower - previous_upper > 0
conclusion:
  kind: avoid
normalized_clause: >
  previous_lower - candidate_upper > 0 OR
  candidate_lower - previous_upper > 0
selection:
  family: adjacent_voice_overlap_depth_gt
  numeric_thresholds_tested: [-4, -3, -2, -1, 0, 1, 2, 3, 4]
  family_rule_budget: 1
  local_log_rate_contrast_max: -0.20

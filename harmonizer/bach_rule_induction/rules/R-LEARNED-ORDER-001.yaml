schema_version: 1
id: R-LEARNED-ORDER-001
title: Évitement du croisement simultané des voix adjacentes
lifecycle: CANDIDATE
status: NORMALLY
statement: >
  Pour deux voix adjacentes, éviter que la candidate de la voix supérieure
  soit située au moins un demi-ton sous la voix inférieure simultanée, ou que
  la candidate de la voix inférieure soit située au moins un demi-ton au-dessus
  de la voix supérieure simultanée.
scope:
  voices: [soprano_alto, alto_tenor, tenor_bass]
  window: [current_attack]
  corpus: music21-3.1.0-deepbach-352
  split: variant-safe-251-50-51
conditions:
  - candidate_upper - simultaneous_lower <= -1
  - OR simultaneous_upper - candidate_lower <= -1
conclusion:
  kind: avoid
normalized_clause: >
  candidate_upper - simultaneous_lower <= -1 OR
  simultaneous_upper - candidate_lower <= -1
selection:
  trigger: V4.1 learned-only generation diagnostics
  family: simultaneous_adjacent_gap_le
  numeric_thresholds_tested: [-2, -1, 0, 1, 2]
  family_rule_budget: 1

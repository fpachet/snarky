schema_version: 1
id: R-LEARNED-DIRECT-002
title: Mouvement direct vers la quinte parfaite
lifecycle: SUPPORTED
status: NORMALLY
statement: >
  Entre les voix extrêmes, éviter d'atteindre une quinte parfaite par
  mouvement de même direction lorsque le soprano procède par un saut de plus
  de deux demi-tons.
scope:
  voices: [soprano, bass]
  window: [previous_attack, current_attack]
  corpus: music21-3.1.0-deepbach-352
  split: variant-safe-251-50-51
conditions:
  - target_outer_interval_mod12 == 7
  - abs(soprano_delta_semitones) > 2
  - learned_same_nonzero_sign(soprano_delta, bass_delta)
conclusion:
  kind: avoid
normalized_clause: >
  abs(candidate_s-current_b)%12 == 7 AND
  abs(candidate_s-prev_s) > 2 AND
  LEARNED_PREDICATE_001 == true

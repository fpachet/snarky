schema_version: 1
id: K3-V24-RESIDUAL-SONORITY-GROUP-1
status: FROZEN
frozen_on: 2026-07-29
purpose: >
  Apprendre conjointement les huit statuts résiduels V24 au-dessus du modèle
  V23 retenu, puis vérifier leur stabilité hors pièces avant génération.

baseline_model: v23_metric_harmony_full_model.json
source_grammar: grammar_v24_residual_sonority.yaml
source_exact_cache: ../../experiments/v5_k3_clean/work/k3-exact-v24-selected-32x10.npz

group:
  id: residual_strong_sonority_status
  feature_kind: central_residual_strong_sonority_status
  size: 8
  matrix_shape: [8]
  identifiability:
    reference_state: strict_unique_named_chord
    sum_over_residual_statuses_zero: false
  l1_inside_group: 0.0005
  l2_group_scaled_by_sqrt_size: true

coverage:
  split: structure_train
  pieces: 32
  minimum_testable_opportunities: 100
  minimum_piece_support: 10
  minimum_authentic_piece_support_for_interpretation: 3

estimation:
  objective: exact_conditional_pseudolikelihood
  optimizer: adam_plus_sparse_group_proximal
  learning_rate: 0.02
  steps_baseline_prefit: 120
  steps_comparison: 180
  return_checkpoint: best_validation_during_discovery
  l1_baseline_by_clause_complexity: 0.001
  l2: 0.001
  group_penalty_path:
    - 0.6
    - 0.3
    - 0.1
    - 0.03
    - 0.0

selection:
  criterion: paired_bootstrap_then_piece_disjoint_stability
  paired_bootstrap_resamples: 100000
  paired_bootstrap_seed: 24029
  minimum_positive_piece_fraction: 0.6

provenance_guards:
  factorization_frozen_before_fit: true
  all_eight_cells_fit_jointly: true
  individual_cells_preselected: false
  generation_metrics_used_for_weight_learning: false
  test_split_loaded: false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snarky"
version = "0.1.0"
description = "A recursive symbolic inference engine inspired by BOOJUM and SNARK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]
keywords = [
    "constraint-programming",
    "expert-systems",
    "inference-engine",
    "symbolic-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/fpachet/snarky"
Repository = "https://github.com/fpachet/snarky.git"
Issues = "https://github.com/fpachet/snarky/issues"
Changelog = "https://github.com/fpachet/snarky/blob/main/CHANGELOG.md"
Documentation = "https://github.com/fpachet/snarky#readme"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hypothesis>=6.0",
    "mypy>=1.14",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/snarky"]

[tool.hatch.build.targets.sdist]
only-include = [
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE_STATUS.md",
    "README.md",
    "SECURITY.md",
    "THIRD_PARTY.md",
    "src/snarky",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests", "sudoku/tests"]
markers = [
    "slow: integration tests that execute many complete inference cases",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
